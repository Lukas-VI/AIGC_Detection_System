<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 生成图像鉴别平台</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <div class="wrap topbar-inner">
      <div class="brand">
        <h1>AI 生成图像鉴别平台</h1>
      </div>
      
      <!-- 主题切换器 -->
      <div class="theme-switcher" id="theme-switcher">
        <button data-theme-val="system" title="跟随系统">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line></svg>
        </button>
        <button data-theme-val="light" title="浅色模式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
        <button data-theme-val="dark" title="深色模式">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="wrap">
    <!-- 模型选择与加载 -->
    <section class="panel">
      <div class="panel-head">
        <h2>检测模型</h2>
        <span id="model-badge" class="badge badge-idle">未加载</span>
      </div>

      <div class="model-row">
        <select id="model-select" aria-label="选择检测模型"></select>
        <button id="load-model" class="btn btn-primary">加载模型</button>
      </div>

      <div id="load-progress" class="progress" hidden>
        <div id="load-progress-bar" class="progress-bar"></div>
      </div>
      <p id="model-status" class="hint">正在读取模型列表…</p>
    </section>

    <!-- 图片输入 -->
    <section class="panel">
      <div class="panel-head">
        <h2>图片输入</h2> 
        <span id="queue-summary" class="hint"></span>
      </div>

      <div id="dropzone" class="dropzone">
        <p class="dropzone-title">拖拽图片到此处，或</p>
        <div class="actions">
          <button id="pick-files" class="btn">选择图片</button>
          <button id="pick-dir" class="btn">选择文件夹</button>
        </div>
        <p class="hint">支持 JPG / PNG / WebP / TIFF / BMP，可多选；文件夹会递归读取其中的图片。</p>
        <input id="file-input" type="file" accept="image/*" multiple hidden>
        <input id="dir-input" type="file" webkitdirectory directory multiple hidden>
      </div>
      <p id="upload-hint" class="hint"></p>
    </section>

    <!-- 统计 -->
    <section class="panel">
      <div class="panel-head">
        <h2>统计</h2>
        <span id="avg-time" class="hint"></span>
      </div>

      <div class="stats">
        <div class="stat"><span class="stat-label">图片总数</span><strong id="stat-total">0</strong></div>
        <div class="stat"><span class="stat-label">已检测</span><strong id="stat-done">0</strong></div>
        <div class="stat"><span class="stat-label">伪造</span><strong id="stat-fake" class="text-fake">0</strong></div>
        <div class="stat"><span class="stat-label">真实</span><strong id="stat-real" class="text-real">0</strong></div>
        <div class="stat"><span class="stat-label">伪造占比</span><strong id="stat-ratio">—</strong></div>
        <div class="stat"><span class="stat-label">平均伪造概率</span><strong id="stat-avg">—</strong></div>
      </div>

      <div class="histogram-block">
        <div id="histogram" class="histogram"></div>
      </div>
    </section>

    <!-- 结果 -->
    <section class="panel">
      <div class="panel-head">
        <h2>鉴别结果</h2>
        <div class="actions">
          <button id="export-json" class="btn" disabled>导出 JSON</button>
          <button id="clear-results" class="btn" disabled>清空</button>
        </div>
      </div>

      <div class="table-wrap">
        <!-- 表头：不参与滚动 -->
        <div class="table-header">
          <table>
            <colgroup>
              <col class="col-thumb">
              <col>
              <col class="col-verdict">
              <col class="col-prob">
              <col class="col-time">
              <col class="col-state">
            </colgroup>
            <thead>
              <tr>
                <th>预览</th>
                <th>文件名</th>
                <th>结果</th>
                <th>伪造概率</th>
                <th>耗时</th>
                <th>状态</th>
              </tr>
            </thead>
          </table>
        </div>

        <!-- 表体：在这个区域内滚动，滚动条自然只在表体出现 -->
        <div class="table-body">
          <table>
            <colgroup>
              <col class="col-thumb">
              <col>
              <col class="col-verdict">
              <col class="col-prob">
              <col class="col-time">
              <col class="col-state">
            </colgroup>
            <tbody id="results-body"></tbody>
          </table>
          <p id="results-empty" class="empty">尚未添加图片。</p>
        </div>
      </div>
    </section>
  </main>

  <footer class="page-footer wrap">
    ©2026
  </footer>

  <script src="./app.js" type="module"></script>
</body>
</html>
